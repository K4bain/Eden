<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    EDEN — a standalone WebGL art piece by Aylux (GitHub: K4bain)
    Phase 2: GSAP timeline — the full text arc. Shell from Phase 1 stays;
    three.js particles/cursor arrive in Phase 3.
    See ./README.md for phase status, and EDEN_FULL_CONTEXT.md for the brief.

    GOTCHA (Section 18 #1): loading-screen CSS is INLINE in <head> to avoid a
    blank flash before the external stylesheet loads. Do NOT move it to style.css.
  -->

  <title>EDEN</title>
  <meta name="description" content="EDEN — an interactive WebGL art piece by Aylux." />
  <meta name="author" content="Aylux" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f0ece4" />

  <!-- Mark JS available before paint. CSS gates initial-state hiding on .js
       so a no-JS visitor still sees the content rather than a blank stage. -->
  <script>document.documentElement.classList.add('js');</script>

  <!-- Google Fonts: Cormorant Garamond 300 (fragile) + 700 (monumental) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Loading screen (INLINE — GOTCHA #1) ─────────────────────────── */
    /* A living seed in the dark: a soft orb that breathes, then the word
       EDEN materializes beneath it as the assets arrive. No progress bar —
       the breathing IS the progress. */
    #loading-screen {
      position: fixed; inset: 0; background: #f0ece4; z-index: 20;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.8rem;
      transition: opacity 0.6s ease;     /* Phase 2: GSAP will drive this fade */
    }
    #loading-screen.is-leaving { opacity: 0; pointer-events: none; }

    /* The breathing orb. Two stacked radial gradients (core + halo) that
       scale + brighten on a slow cycle, like a held breath. */
    .loading-orb {
      position: relative;
      width: clamp(60px, 9vw, 96px);
      height: clamp(60px, 9vw, 96px);
      animation: orb-breathe 2.6s ease-in-out infinite;
    }
    .loading-orb__core,
    .loading-orb__halo {
      position: absolute; inset: 0; border-radius: 50%;
    }
    .loading-orb__core {
      background: radial-gradient(circle at 50% 45%,
        #c4943a 0%, #8B5E3C 35%, rgba(139,94,60,0) 70%);
      filter: blur(0.5px);
    }
    .loading-orb__halo {
      background: radial-gradient(circle at 50% 45%,
        rgba(196,148,58,0.3) 0%, rgba(139,94,60,0.08) 40%, rgba(0,0,0,0) 72%);
      transform: scale(2.0);
      filter: blur(8px);
      animation: orb-halo 2.6s ease-in-out infinite;
    }

    /* The word materializes as the orb breathes — opacity tracks the breath
       so it feels born of the light, not typed beneath it. */
    .loading-word {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(0.7rem, 1.4vw, 0.95rem); color: #8B5E3C;
      letter-spacing: 0.55em; text-transform: uppercase;
      margin: 0; line-height: 1; padding-left: 0.55em; /* optical centering */
      opacity: 0.35;
      animation: word-breathe 2.6s ease-in-out infinite;
    }

    @keyframes orb-breathe {
      0%, 100% { transform: scale(0.82); opacity: 0.55; }
      50%      { transform: scale(1.0);  opacity: 1.0;  }
    }
    @keyframes orb-halo {
      0%, 100% { opacity: 0.4; transform: scale(1.7); }
      50%      { opacity: 0.9; transform: scale(2.1); }
    }
    @keyframes word-breathe {
      0%, 100% { opacity: 0.2; letter-spacing: 0.55em; }
      50%      { opacity: 0.6; letter-spacing: 0.6em; }
    }

    /* Stop any flash of the wrong background before style.css applies. */
    html, body { background: #f0ece4; }
  </style>

  <!-- GSAP Club plugins (vendor/gsap/) for Awwwards-level scroll + text animation -->

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    LAYER STACK (Section 12). z-index architecture lives in style.css.
    CRITICAL (GOTCHA #5): html and body carry NO transform / filter /
    will-change / clip-path — those create stacking contexts and break
    z-index. Keep them clean forever.
  -->

  <!-- -1 · WebGL scene (paper-cut relief + particles) -->
  <canvas id="webgl-canvas"></canvas>

  <!-- 0 · Custom cursor light, drawn in 2D (Phase 3). pointer-events: none. -->
  <canvas id="cursor-canvas"></canvas>

  <!-- 1 · Background painting surface -->
  <div id="bg-main" aria-hidden="true"></div>

  <!-- 2 · Secondary atmosphere layer -->
  <div id="bg-atmosphere" aria-hidden="true"></div>

  <!-- 3 · Vignette (pure CSS radial gradient — no image) -->
  <div id="vignette" aria-hidden="true"></div>

  <!-- 4 · Film grain overlay (procedural SVG tile in Phase 1) -->
  <div id="grain" aria-hidden="true"></div>

  <!-- 10 · The only content the visitor ever sees -->
  <main id="eden-content">
    <p class="eden-opening">In the beginning.</p>
    <h1 class="eden-name">EDEN</h1>
    <p class="eden-secondary">Saper vedere.</p>
  </main>

  <!-- 11 · Scroll hint — appears at RESOLUTION (Section 13, +3.5s) -->
  <div id="scroll-hint" aria-hidden="true"></div>

  <!-- 12 · Scroll content — reveals after the EDEN moment -->
  <!-- ScrollSmoother: wrapper = viewport, content = full scrollable height -->
  <div id="smooth-wrapper">
    <section id="smooth-content">
      <div class="scroll-section" data-speed="0.8">
        <p class="scroll-quote">"Every act of creation<br/>is an act of uncreation."</p>
        <span class="scroll-attribution">— Pablo Picasso</span>
      </div>

      <div class="scroll-section" data-speed="0.6">
        <p class="scroll-philosophy">
          To see things as they are,<br/>
          not as they appear.<br/>
          <em>Saper vedere.</em>
        </p>
      </div>

      <div class="scroll-section" data-speed="0.4">
        <p class="scroll-coda">
          In the beginning, there was nothing.<br/>
          Then there was everything.
        </p>
      </div>

      <div class="scroll-section scroll-section--end" data-speed="0.2">
        <p class="scroll-credit">
          <span class="scroll-credit__label">EDEN</span>
          <span class="scroll-credit__by">by Aylux</span>
        </p>
      </div>
    </section>
  </div>

  <!-- 20 · Loading screen — a breathing seed (fades out via js/main.js) -->
  <div id="loading-screen" aria-hidden="true">
    <div class="loading-orb">
      <div class="loading-orb__halo"></div>
      <div class="loading-orb__core"></div>
    </div>
    <p class="loading-word">EDEN</p>
  </div>

  <!--
    Phase 2/3 script chain.
    - Classic (global) CDNs first: GSAP, ScrollTrigger.
    - GSAP Club plugins from vendor/gsap/: Observer, ScrollSmoother, SplitText, CustomEase, Flip, EasePack.
    - Phase 2 Eden files as classic scripts: loader.js, timeline.js.
    - Phase 3 Three.js + main.js as ES modules (importmap maps "three").
    NOTE: ES modules require http:// — open via `npx serve eden` or VS Code
    Live Server, NOT the file:// desktop shortcut.
  -->
  <script defer src="./vendor/gsap/gsap.min.js"></script>
  <script defer src="./vendor/gsap/ScrollTrigger.min.js"></script>
  <script defer src="./vendor/gsap/Observer.min.js"></script>
  <script defer src="./vendor/gsap/ScrollSmoother.min.js"></script>
  <script defer src="./vendor/gsap/SplitText.min.js"></script>
  <script defer src="./vendor/gsap/CustomEase.min.js"></script>
  <script defer src="./vendor/gsap/Flip.min.js"></script>
  <script defer src="./vendor/gsap/EasePack.min.js"></script>
  <script defer src="./js/eden/loader.js"></script>
  <script defer src="./js/eden/timeline.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
